[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-delegation-topology-router"
version = "0.1.0"
description = "Top-down mission decomposition and capability-routed delegation tree for multi-tier agent swarms"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
hierarchical-delegation-topology-router = "hierarchical_delegation_topology_router.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hierarchical_delegation_topology_router*"]
